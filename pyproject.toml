[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stranger-test"
dynamic = ["version"]
description = "Two-user tenant isolation tests for AI applications: MCP servers and gateways, agent memory, and LLM response caches."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vedant Agarwal" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "authorization",
    "confused-deputy",
    "tenant-isolation",
    "agent-memory",
    "semantic-cache",
    "llm",
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/strangertest-labs/stranger-test"

[project.scripts]
strangertest = "strangertest.cli:main"
stranger-test = "strangertest.cli:main"

[tool.setuptools]
packages = ["strangertest", "strangertest.scan"]

[tool.setuptools.dynamic]
version = { attr = "strangertest.__version__" }
